[build]
  command = "npm ci && npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/acerca/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/acerca/"
  status = 301

[[redirects]]
  from = "/guias/analisis-alimentos-y-forrajes.html"
  to = "/guias/analisis-alimentos-y-forrajes/"
  status = 301

[[redirects]]
  from = "/guias/guia-composicion-quimica-alimentos.html"
  to = "/guias/composicion-quimica/"
  status = 301

[[redirects]]
  from = "/guias/guia-composicion-quimica-alimentos"
  to = "/guias/composicion-quimica/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Disposition = "attachment"

[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
