name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      - name: Verificar artefactos
        run: |
          test -f build/client/index.html
          test -f build/client/404.html
          test -f build/client/sitemap.xml
          test -f build/client/_headers
          test -d build/client/pagefind
          grep -q "sha256-" build/client/_headers

      - name: Enlaces internos
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/build/client" --exclude-path build/client/pagefind "build/client/**/*.html"
          fail: true
